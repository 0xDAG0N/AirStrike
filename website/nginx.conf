server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files with caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Route all other requests to index.html for SPA compatibility
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access to git and other sensitive files
    location ~ /\. {
        deny all;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json text/xml application/xml;
    gzip_min_length 1024;
}
