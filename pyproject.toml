[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airstrike"
version = "0.1.0"
description = "AirStrike — wireless security assessment framework with an integrated web interface."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "Flask>=2.2",
    "Flask-SocketIO>=5.3",
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

# Canonical launch: `sudo airstrike` (or the kept `sudo python run.py` shim).
[project.scripts]
airstrike = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**", "static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
